{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Finance{% endblock %} - HRBS</title>
    <style>
        :root {
            --ink: #1f2933;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #2563eb;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0; background: var(--bg); color: var(--ink);
        }
        nav {
            background: #111827; color: #fff; padding: 14px 24px;
            display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
        }
        nav a { color: #cbd5e1; text-decoration: none; font-size: 14px; }
        nav a:hover, nav a.active { color: #fff; }
        nav .brand { font-weight: 700; color: #fff; margin-right: 12px; }
        main { max-width: 1100px; margin: 28px auto; padding: 0 20px 60px; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        .subtitle { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
        .filter-bar {
            background: #fff; border: 1px solid var(--line); border-radius: 8px;
            padding: 14px 16px; margin-bottom: 20px; display: flex; gap: 14px;
            align-items: flex-end; flex-wrap: wrap; font-size: 14px;
        }
        .filter-bar label { display: block; color: var(--muted); margin-bottom: 4px; }
        .filter-bar input, .filter-bar select {
            padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
        }
        .filter-bar button {
            background: var(--accent); color: #fff; border: none; border-radius: 6px;
            padding: 7px 16px; font-size: 14px; cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
        th { background: #f1f5f9; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:last-child td { border-bottom: none; }
        .totals-row td { font-weight: 700; background: #f8fafc; }
        .card-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .card {
            background: #fff; border: 1px solid var(--line); border-radius: 8px;
            padding: 16px 20px; min-width: 160px; flex: 1;
        }
        .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; }
        .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
        .badge { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-DRAFT { background: #e2e8f0; color: #475569; }
        .badge-ISSUED { background: #dbeafe; color: #1d4ed8; }
        .badge-PAID { background: #dcfce7; color: #15803d; }
        .badge-OVERDUE { background: #fee2e2; color: #b91c1c; }
        .badge-CANCELLED { background: #f1f5f9; color: #94a3b8; }
        .text-right { text-align: right; }
        .empty { color: var(--muted); padding: 20px; text-align: center; }
        @media print {
            nav, .filter-bar, .no-print { display: none !important; }
            body { background: #fff; }
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">HRBS · Finance</span>
        <a href="{% url 'finance:dashboard' %}">Dashboard</a>
        <a href="{% url 'finance:financial_summary' %}">Financial Summary</a>
        <a href="{% url 'finance:ledger' %}">Ledger</a>
        <a href="{% url 'finance:invoice_list' %}">Invoices</a>
        <a href="{% url 'finance:revenue' %}">Revenue</a>
        <span style="margin-left: auto; color:#94a3b8;">
            {% if request.user.is_authenticated %}{{ request.user.username }}{% endif %}
        </span>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
