<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}|Hotel Room Booking System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
        }
        .navbar-brand { font-weight: bold; }
        /* ফুটার ডিজাইন */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container position-relative">

            <a class="navbar-brand" href="/">HRBS</a>

            <h1 class="position-absolute start-50 translate-middle-x m-0 fs-4 text-white">
                HOLIDAY TOURISM
            </h1>

            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/track/">Track Booking (OTP)</a>
            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4 flex-grow-1">
        <div  class="w-70 mx-auto  p-3 text-center ">
            <h2 class="text-primary"> Our available co-branded hotels and resorts are here </h2>
            <h4 class="text-warning"> Choose your best one as you like</h4>
        </div>
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        All right reserved@ Holiday Tourism Group. Developed by CodeKarigor
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
