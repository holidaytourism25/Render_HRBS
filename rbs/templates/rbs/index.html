{% extends 'base.html' %}

{% block title %}
  {{ request.resolver_match.url_name|title }}
{% endblock %}

{% block content %}
<div class="row mb-4">
    
    <div class="col-md-8 offset-md-2 bg-danger text-white p-3 rounded-5">
        <h3 class="mb-4 text-center ">Search your Hotel/ Resort by price</h3>
        <form method="GET">
            <div class="row  d-flex justify-content-center">
                <div class="col-md-4">
                    <input type="number" name="min_price"
                        class="form-control"
                        placeholder="Min Price">
                </div>

                <div class="col-md-4">
                    <input type="number" name="max_price"
                        class="form-control"
                        placeholder="Max Price">
                </div>

                <div class="col-md-2">
                    <button type="submit"
                            class="btn btn-primary w-100">
                        Search
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="row">
    {% for hotel in hotels %}
    <div class="col-md-4">
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body">
                <h5 class="card-title">{{ hotel.name }}</h5>
                <p class="text-muted small">{{ hotel.location }}</p>
                <a href="{% url 'hotel_detail' hotel.id %}"
                   class="btn btn-primary w-100">
                    View Rooms
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-warning">
            No hotels found.
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
