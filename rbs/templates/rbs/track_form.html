{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 text-center">
        <div class="card shadow-sm p-4 border-0">
            <h3 class="fw-bold mb-3">বুকিং ট্র্যাক করুন</h3>
            <p class="text-muted">আপনার বুকিং হিস্ট্রি দেখতে মোবাইল নম্বর দিন।</p>
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="mobile" class="form-control form-control-lg mb-3" placeholder="01XXXXXXXXX" required>
                <button type="submit" class="btn btn-primary btn-lg w-100">OTP পাঠান</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
