{% extends 'base.html' %}

{% block header_banner %}{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-person-gear me-2"></i> Update Profile</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" value="{{ request.user.username }}" disabled>
                        <small class="text-muted">Username cannot be changed.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        {{ form.first_name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        {{ form.last_name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        {{ form.email }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'rbs:user_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
